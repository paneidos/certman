[project]
name = "certman"
version = "0.2.1"
description = "Manage keys and certificates using p12 files"
authors = [{ name = "Sernin van de Krol", email = "serninpc@paneidos.net" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "typer>=0.25.1",
    "cryptography>=48.0.0",
    "typing-extensions>=4.15.0",
]

[project.scripts]
certman = "certman.main:app"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "black>=23.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "certman",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["certman"]
